services:
  - type: web
    name: bharatfresh-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_TTL_MINUTES
        value: 10
      - key: REQUEST_EXPIRY_MINUTES
        value: 20
      - key: DB_SSL_ALLOW_SELF_SIGNED
        value: true
      - key: RUN_MIGRATIONS
        value: true
